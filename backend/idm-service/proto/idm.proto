syntax = "proto3";

package idm;

// IDM – Identity Management (Lab 4).
// Login / ValidateToken are public; every other RPC requires
// "authorization: Bearer <JWS>" metadata (see auth_interceptor.py).
service IdmService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc ValidateToken(TokenRequest) returns (ValidateResponse);
  rpc Logout(TokenRequest) returns (LogoutResponse);

  // admin only
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}

message LoginRequest {
  string username = 1;   // email
  string password = 2;
}

message LoginResponse {
  string token = 1;      // JWS, Base64Url
}

message TokenRequest {
  string token = 1;
}

message ValidateResponse {
  bool valid = 1;
  string sub = 2;
  string role = 3;
  string message = 4;    // ok | expired | invalid | blacklisted | missing
  string email = 5;      // used by Client WebService to map user <-> client document
}

message LogoutResponse {
  bool success = 1;
  string message = 2;
}

message CreateUserRequest {
  string email = 1;
  string password = 2;
  string role = 3;       // "owner-event" | "client"
}

message CreateUserResponse {
  bool success = 1;
  string message = 2;
  string sub = 3;
  string role = 4;
}

message User {
  string id = 1;
  string email = 2;
  string role = 3;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {
  bool success = 1;
  string message = 2;
}
