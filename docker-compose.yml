services:
  # ------------------------------------------------------------------ databases
  mariadb:
    image: mariadb:11
    container_name: ${EVENTS_DB_CONTAINER:-pos-mariadb}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/db_user_pass
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_pass

      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_ADMIN_USER: ${DB_ADMIN_USER}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./backend/mariadb-init:/docker-entrypoint-initdb.d:ro
    networks:
      - pos-network
    secrets:
      - db_root_pass
      - db_user_pass
      - db_admin_pass
    healthcheck:
      test: [ "CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-u", "${DB_USER}", "--password=$$(cat /run/secrets/db_user_pass)" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongo:
    user: "0:0"
    image: mongo:8
    container_name: ${CLIENTS_DB_CONTAINER:-pos-mongo}
    restart: unless-stopped
    command: ["mongod", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ADMIN_USER}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_admin_pass

      MONGO_DB_NAME: ${MONGO_DB_NAME}

      MONGO_DB_OWNER_USER: ${MONGO_DB_OWNER_USER}
      MONGO_DB_OWNER_PASS_FILE: /run/secrets/mongo_db_owner_pass

      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASS_FILE: /run/secrets/mongo_app_pass
    volumes:
      - mongo-data:/data/db
      - ./backend/mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - pos-network
    secrets:
      - mongo_admin_pass
      - mongo_db_owner_pass
      - mongo_app_pass
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$$(cat /run/secrets/mongo_admin_pass)\" --authenticationDatabase admin --eval \"db.adminCommand('ping')\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # IDM users live in their own SQL server (Lab 5: one container per database)
  idm-db:
    image: mariadb:11
    container_name: ${IDM_DB_CONTAINER:-pos-idm-db}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${IDM_DB_NAME}
      MARIADB_USER: ${IDM_DB_USER}
      MARIADB_PASSWORD_FILE: /run/secrets/idm_db_pass
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/idm_db_root_pass
    volumes:
      - idm-db-data:/var/lib/mysql
    networks:
      - pos-network
    secrets:
      - idm_db_root_pass
      - idm_db_pass
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ------------------------------------------------------------------ services
  idm-service:
    build:
      context: ./backend/idm-service
      dockerfile: Dockerfile
    container_name: pos-idm-service
    restart: unless-stopped
    environment:
      IDM_GRPC_PORT: "50051"
      IDM_DB_HOST: ${IDM_DB_CONTAINER:-pos-idm-db}
      IDM_DB_PORT: "3306"
      IDM_DB_NAME: ${IDM_DB_NAME}
      IDM_DB_USER: ${IDM_DB_USER}
      IDM_DB_PASS_FILE: /run/secrets/idm_db_pass
      IDM_JWT_SECRET: ${IDM_JWT_SECRET}
      IDM_JWT_ISSUER: ${IDM_JWT_ISSUER}
      IDM_JWT_TTL_SECONDS: "3600"
      IDM_TLS_CERT: "/certs/idm.crt"
      IDM_TLS_KEY: "/certs/idm.key"
    depends_on:
      idm-db:
        condition: service_healthy
    ports:
      - "50051:50051"
    volumes:
      - ./certs:/certs:ro
    networks:
      - pos-network
    secrets:
      - idm_db_pass
    healthcheck:
      test: [ "CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 50051), 2)" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  events-manager-service:
    user: "0:0"
    build:
      context: ./backend/events-manager-service
      dockerfile: Dockerfile
    container_name: pos-events-manager
    restart: unless-stopped
    environment:
      DB_HOST: ${EVENTS_DB_CONTAINER:-pos-mariadb}
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS_FILE: /run/secrets/db_user_pass
      IDM_GRPC_HOST: pos-idm-service
      IDM_GRPC_PORT: 50051
      IDM_TLS_ROOT_CERT: "/certs/idm.crt"
      CLIENTS_PUBLIC_URL: ${CLIENTS_PUBLIC_URL:-http://localhost:8001}
    depends_on:
      mariadb:
        condition: service_healthy
      idm-service:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - pos-network
    secrets:
      - db_user_pass
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\"" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - ./certs:/certs:ro

  clients-service:
    build:
      context: ./backend/clients-service
      dockerfile: Dockerfile
    container_name: pos-clients
    restart: unless-stopped
    environment:
      MONGO_HOST: ${CLIENTS_DB_CONTAINER:-pos-mongo}
      MONGO_PORT: 27017
      MONGO_DB_NAME: ${MONGO_DB_NAME}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASS_FILE: /run/secrets/mongo_app_pass
      MONGO_CLIENTS_COLLECTION: ${MONGO_CLIENTS_COLLECTION}
      IDM_GRPC_HOST: pos-idm-service
      IDM_GRPC_PORT: 50051
      IDM_TLS_ROOT_CERT: "/certs/idm.crt"

      DATA_SERVICE_URL: http://pos-events-manager:8000
      EVENTS_PUBLIC_URL: ${EVENTS_PUBLIC_URL:-http://localhost:8000}
    depends_on:
      mongo:
        condition: service_healthy
      events-manager-service:
        condition: service_healthy
      idm-service:
        condition: service_healthy
    ports:
      - "8001:8000"
    networks:
      - pos-network
    secrets:
      - mongo_app_pass
    volumes:
      - ./certs:/certs:ro

volumes:
  mariadb-data:
  mongo-data:
  idm-db-data:

networks:
  pos-network:
    name: pos-network
    driver: bridge

# one file per secret in ./secrets (see scripts/init-secrets.*); the folder is git-ignored
secrets:
  db_root_pass:
    file: ./secrets/db_root_pass.txt
  db_user_pass:
    file: ./secrets/db_user_pass.txt
  db_admin_pass:
    file: ./secrets/db_admin_pass.txt
  mongo_admin_pass:
    file: ./secrets/mongo_admin_pass.txt
  mongo_db_owner_pass:
    file: ./secrets/mongo_db_owner_pass.txt
  mongo_app_pass:
    file: ./secrets/mongo_app_pass.txt
  idm_db_root_pass:
    file: ./secrets/idm_db_root_pass.txt
  idm_db_pass:
    file: ./secrets/idm_db_pass.txt
