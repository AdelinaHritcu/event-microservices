services:
  mariadb:
    image: mariadb:11
    container_name: pos-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql

  mongo:
    image: mongo:8
    container_name: pos-mongo
    restart: unless-stopped
    command: ["--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ADMIN_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ADMIN_PASS}
      MONGO_DB_NAME: ${MONGO_DB_NAME}
      MONGO_DB_OWNER_USER: ${MONGO_DB_OWNER_USER}
      MONGO_DB_OWNER_PASS: ${MONGO_DB_OWNER_PASS}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASS: ${MONGO_APP_PASS}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo-init.sh:/docker-entrypoint-initdb.d/mongo-init.sh:ro

  api:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: pos-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - mariadb
      - mongo
    ports:
      - "8000:8000"

  adminer:
    image: adminer
    container_name: pos-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mariadb

volumes:
  mariadb-data:
  mongo-data:
