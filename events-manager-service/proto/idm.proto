syntax = "proto3";

package idm;

service IdmService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc ValidateToken(TokenRequest) returns (ValidateResponse);
  rpc Logout(TokenRequest) returns (LogoutResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
}

message TokenRequest {
  string token = 1;
}

message ValidateResponse {
  bool valid = 1;
  string sub = 2;
  string role = 3;
  string message = 4;
}

message LogoutResponse {
  bool success = 1;
  string message = 2;
}
